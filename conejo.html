<title>Conejo Glotón</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
  /* Una sola pantalla de cielo: el juego ocupa todo, con marcador arriba y panel encima al empezar/terminar */
  :root {
    --sky-top: #6fc3ff;
    --sky-bottom: #d9f1ff;
    --grass: #5cc06a;
    --ink: #24314f;
    --card: #fffdf7;
    --pop: #ff5d8f;
    --sun: #ffd23f;
    --display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
    --body: "Nunito", ui-rounded, system-ui, sans-serif;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    background: var(--sky-top);
    color: var(--ink);
    font-family: var(--body);
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap { position: relative; height: 100%; width: 100%; }
  canvas { display: block; width: 100%; height: 100%; cursor: none; }

  #hud {
    position: absolute; top: 12px; left: 16px; right: 16px;
    display: flex; gap: 12px; align-items: center; justify-content: space-between;
    pointer-events: none;
  }
  .chip {
    background: var(--card); border-radius: 999px; padding: 6px 14px;
    font-family: var(--display); font-size: 22px; letter-spacing: .5px;
    box-shadow: 0 3px 0 rgba(36,49,79,.18);
    font-variant-numeric: tabular-nums;
  }
  #belly { flex: 1; max-width: 360px; display: flex; flex-direction: column; gap: 4px; }
  #belly small {
    font-family: var(--display); font-size: 14px; letter-spacing: 1px;
    text-transform: uppercase; color: var(--card); text-shadow: 0 2px 0 rgba(36,49,79,.35);
  }
  #bar { height: 18px; background: var(--card); border-radius: 999px; padding: 3px; box-shadow: 0 3px 0 rgba(36,49,79,.18); }
  #fill { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, var(--sun), var(--pop)); transition: width .15s; }

  #panel {
    position: absolute; inset: 0; display: grid; place-items: center; padding: 16px;
    background: rgba(36,49,79,.25);
  }
  .card {
    background: var(--card); border-radius: 28px; padding: 28px 24px; max-width: 420px; width: 100%;
    text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center;
    box-shadow: 0 8px 0 rgba(36,49,79,.2);
  }
  .card h1 {
    margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(38px, 10vw, 56px);
    line-height: 1; color: var(--pop); text-wrap: balance;
    text-shadow: 0 4px 0 var(--sun);
  }
  .card p { margin: 0; font-size: 17px; line-height: 1.45; max-width: 32ch; }
  .card .keys { font-size: 14px; opacity: .75; }
  button {
    font-family: var(--display); font-size: 26px; letter-spacing: .5px;
    background: var(--pop); color: var(--card); border: 0; border-radius: 999px;
    padding: 12px 34px; cursor: pointer; box-shadow: 0 5px 0 #c73565;
    transition: transform .08s;
  }
  button:active { transform: translateY(3px); box-shadow: 0 2px 0 #c73565; }
  button:focus-visible { outline: 4px solid var(--sun); outline-offset: 3px; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } #fill { transition: none; } }
</style>

<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="chip" id="score">🍓 0</div>
    <div id="belly"><small>Panza</small><div id="bar"><div id="fill"></div></div></div>
  </div>
  <div id="panel">
    <div class="card">
      <h1 id="ptitle">Conejo Glotón</h1>
      <p id="ptext">Mueve al conejo y atrapa las frutas que caen del cielo. Cuando se llene la panza... ¡cuidado!</p>
      <button id="play" type="button">¡Jugar!</button>
      <p class="keys">Flechas ← → o arrastra con el dedo / ratón</p>
    </div>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const scoreEl = document.getElementById('score');
  const fillEl = document.getElementById('fill');
  const panel = document.getElementById('panel');
  const ptitle = document.getElementById('ptitle');
  const ptext = document.getElementById('ptext');
  const playBtn = document.getElementById('play');

  const GOAL = 30;               // frutas para explotar
  const FRUITS = ['🍎','🍌','🍓','🍇','🍊','🍉','🍒','🍍','🥕','🍑'];
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W = 0, H = 0, dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = cv.clientWidth; H = cv.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  addEventListener('resize', resize); resize();

  // ---------- sonido ----------
  let ac = null;
  function audio() { if (!ac) try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} return ac; }
  function blip(freq, dur = .1, type = 'square', vol = .08) {
    const a = audio(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, a.currentTime);
    o.frequency.exponentialRampToValueAtTime(freq * 1.8, a.currentTime + dur);
    g.gain.setValueAtTime(vol, a.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + dur);
    o.connect(g).connect(a.destination); o.start(); o.stop(a.currentTime + dur);
  }
  function boomSound() {
    const a = audio(); if (!a) return;
    const len = a.sampleRate * 1.4, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.5);
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = buf; f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = .9;
    s.connect(f).connect(g).connect(a.destination); s.start();
    blip(70, .6, 'sawtooth', .2);
  }

  // ---------- estado ----------
  const bunny = { x: 0, tx: 0, squish: 0, blink: 0, chew: 0 };
  let fruits = [], parts = [], clouds = [], eaten = 0, state = 'menu';
  let spawnT = 0, time = 0, shake = 0, flash = 0, swellT = 0, boomT = 0;
  const keys = {};

  for (let i = 0; i < 6; i++) clouds.push({ x: Math.random(), y: .08 + Math.random() * .4, s: .6 + Math.random() * .8, v: .004 + Math.random() * .01 });

  function fullness() { return Math.min(eaten / GOAL, 1); }
  function bunnyScale() { return 1 + fullness() * 1.1 + (state === 'swell' ? Math.sin(swellT * 40) * .06 + swellT * .5 : 0); }
  function ground() { return H - Math.max(60, H * .1); }

  function reset() {
    fruits = []; parts = []; eaten = 0; spawnT = 0; shake = 0; flash = 0; swellT = 0; boomT = 0;
    bunny.x = bunny.tx = W / 2; updateHud();
  }
  function updateHud() {
    scoreEl.textContent = '🍓 ' + eaten + ' / ' + GOAL;
    fillEl.style.width = (fullness() * 100) + '%';
  }

  function spawn() {
    const golden = Math.random() < .08;
    fruits.push({
      x: 30 + Math.random() * (W - 60), y: -40,
      vy: 120 + Math.random() * 80 + eaten * 6,
      rot: Math.random() * 6, vr: (Math.random() - .5) * 4,
      e: golden ? '⭐' : FRUITS[(Math.random() * FRUITS.length) | 0],
      worth: golden ? 3 : 1, size: golden ? 40 : 36
    });
  }

  function burst(x, y, n, emojis, speed) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = speed * (.3 + Math.random());
      parts.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - speed * .4,
        life: 1.5 + Math.random() * 1.5, max: 3, rot: Math.random() * 6, vr: (Math.random() - .5) * 10,
        e: emojis ? emojis[(Math.random() * emojis.length) | 0] : null,
        c: ['#ffffff', '#ffd6e4', '#ff5d8f', '#ffd23f'][(Math.random() * 4) | 0],
        r: 4 + Math.random() * 8, size: 24 + Math.random() * 22
      });
    }
  }

  // ---------- controles ----------
  addEventListener('keydown', e => { keys[e.key] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); });
  addEventListener('keyup', e => { keys[e.key] = false; });
  function pointer(e) { if (state === 'play') bunny.tx = e.clientX - cv.getBoundingClientRect().left; }
  cv.addEventListener('pointermove', pointer);
  cv.addEventListener('pointerdown', pointer);

  playBtn.addEventListener('click', () => {
    audio(); if (ac && ac.state === 'suspended') ac.resume();
    reset(); state = 'play'; panel.hidden = true;
  });

  // ---------- dibujo ----------
  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#6fc3ff'); g.addColorStop(1, '#d9f1ff');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // sol
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.arc(W - 70, 90, 38, 0, 7); ctx.fill();
    ctx.globalAlpha = .25; ctx.beginPath(); ctx.arc(W - 70, 90, 54 + Math.sin(time * 2) * 4, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    // nubes
    ctx.fillStyle = '#ffffff';
    for (const c of clouds) {
      const x = ((c.x + time * c.v) % 1.3 - .15) * W, y = c.y * H, s = c.s * 30;
      ctx.beginPath();
      ctx.arc(x, y, s, 0, 7); ctx.arc(x + s, y - s * .5, s * 1.2, 0, 7); ctx.arc(x + s * 2.2, y, s, 0, 7);
      ctx.fill();
    }
    // pasto
    const gy = ground();
    ctx.fillStyle = '#5cc06a'; ctx.fillRect(0, gy, W, H - gy);
    ctx.fillStyle = '#4aa858';
    for (let x = 0; x < W; x += 18) { ctx.beginPath(); ctx.moveTo(x, gy); ctx.lineTo(x + 9, gy - 10); ctx.lineTo(x + 18, gy); ctx.fill(); }
  }

  function ellipse(x, y, rx, ry, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.fill(); }

  function drawBunny() {
    const s = bunnyScale(), f = fullness();
    const gy = ground();
    const sq = bunny.squish;
    ctx.save();
    ctx.translate(bunny.x, gy);
    const red = state === 'swell' ? Math.min(swellT / 1.6, 1) : 0;
    const fur = red ? `rgb(255,${Math.round(255 - red * 120)},${Math.round(255 - red * 130)})` : '#ffffff';
    const out = '#24314f';
    ctx.lineWidth = 3; ctx.strokeStyle = out;

    // sombra
    ellipse(0, 4, 50 * s, 10, 'rgba(36,49,79,.18)');

    const bodyW = 42 * (1 + f * 1.3) * (s / (1 + f * 1.1)) * (1 + sq * .15);
    const bodyH = 40 * (1 + f * .6) * (1 - sq * .15);
    // patas
    ellipse(-bodyW * .55, -6, 16, 9, fur); ctx.stroke();
    ellipse(bodyW * .55, -6, 16, 9, fur); ctx.stroke();
    // cuerpo (panza que crece)
    ellipse(0, -bodyH, bodyW, bodyH, fur); ctx.stroke();
    ellipse(0, -bodyH * .85, bodyW * .62, bodyH * .7, '#ffe4ec');
    // cabeza
    const hy = -bodyH * 2 - 22 + sq * 6, hr = 30 + f * 6;
    // orejas
    const wig = Math.sin(time * 6) * .08;
    for (const side of [-1, 1]) {
      ctx.save(); ctx.translate(side * 13, hy - hr * .7); ctx.rotate(side * (.18 + wig));
      ellipse(0, -30, 11, 32, fur); ctx.stroke();
      ellipse(0, -28, 5, 22, '#ffb3c9');
      ctx.restore();
    }
    ellipse(0, hy, hr * 1.05, hr, fur); ctx.stroke();
    // mejillas
    ellipse(-hr * .6, hy + 8, 8 + f * 5, 5 + f * 3, '#ffb3c9');
    ellipse(hr * .6, hy + 8, 8 + f * 5, 5 + f * 3, '#ffb3c9');
    // ojos
    ctx.fillStyle = out;
    if (state === 'swell') {
      ctx.lineWidth = 3;
      for (const side of [-1, 1]) { // ojos en espiral / X
        ctx.beginPath(); ctx.moveTo(side * 11 - 5, hy - 9); ctx.lineTo(side * 11 + 5, hy + 1);
        ctx.moveTo(side * 11 + 5, hy - 9); ctx.lineTo(side * 11 - 5, hy + 1); ctx.stroke();
      }
    } else if (bunny.blink > 0) {
      ctx.lineWidth = 3;
      for (const side of [-1, 1]) { ctx.beginPath(); ctx.moveTo(side * 11 - 5, hy - 4); ctx.lineTo(side * 11 + 5, hy - 4); ctx.stroke(); }
    } else {
      for (const side of [-1, 1]) {
        ctx.fillStyle = out; ctx.beginPath(); ctx.arc(side * 11, hy - 4, 5.5, 0, 7); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(side * 11 + 2, hy - 6, 2, 0, 7); ctx.fill();
      }
    }
    // nariz y boca
    ellipse(0, hy + 6, 4, 3, '#ff5d8f');
    ctx.lineWidth = 2.5; ctx.strokeStyle = out;
    ctx.beginPath();
    if (bunny.chew > 0 || state === 'swell') {
      ellipse(0, hy + 15, 7, 5 + Math.abs(Math.sin(time * 30)) * 3, out);
    } else {
      ctx.moveTo(-6, hy + 12); ctx.quadraticCurveTo(-3, hy + 16, 0, hy + 11); ctx.quadraticCurveTo(3, hy + 16, 6, hy + 12); ctx.stroke();
    }
    // dientes
    ctx.fillStyle = '#fff'; ctx.fillRect(-3, hy + 11, 6, 5); ctx.strokeRect(-3, hy + 11, 6, 5);
    ctx.restore();
    return { top: gy + hy - hr, w: Math.max(hr * 1.2, bodyW) };
  }

  function drawEmoji(e, x, y, size, rot) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(e, 0, 0); ctx.restore();
  }

  // ---------- bucle ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, .05); last = now; time += dt;

    if (state === 'play' || state === 'menu') {
      if (state === 'menu') bunny.tx = W / 2 + Math.sin(time) * W * .2;
      if (keys.ArrowLeft || keys.a) bunny.tx = bunny.x - 400 * dt * 3;
      if (keys.ArrowRight || keys.d) bunny.tx = bunny.x + 400 * dt * 3;
      bunny.tx = Math.max(40, Math.min(W - 40, bunny.tx));
      const speed = 12 / (1 + fullness() * .8);  // más lento cuando está gordito
      bunny.x += (bunny.tx - bunny.x) * Math.min(1, dt * speed);
    }
    bunny.squish = Math.max(0, bunny.squish - dt * 4);
    bunny.chew = Math.max(0, bunny.chew - dt);
    bunny.blink = bunny.blink > 0 ? bunny.blink - dt : (Math.random() < .005 ? .12 : 0);
    shake = Math.max(0, shake - dt * 30);
    flash = Math.max(0, flash - dt * 2);

    ctx.save();
    if (shake && !reduced) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    drawSky();

    let hit = null;
    if (state !== 'boom') hit = drawBunny();

    // frutas
    if (state === 'play' || state === 'menu') {
      spawnT -= dt;
      if (spawnT <= 0) { spawn(); spawnT = Math.max(.35, .9 - eaten * .02) * (state === 'menu' ? 1.5 : 1); }
    }
    for (let i = fruits.length - 1; i >= 0; i--) {
      const fr = fruits[i];
      fr.y += fr.vy * dt; fr.rot += fr.vr * dt;
      drawEmoji(fr.e, fr.x, fr.y, fr.size, fr.rot);
      if (state === 'play' && hit && fr.y > hit.top - 10 && fr.y < hit.top + 50 && Math.abs(fr.x - bunny.x) < hit.w + 10) {
        fruits.splice(i, 1);
        eaten = Math.min(GOAL, eaten + fr.worth);
        bunny.squish = 1; bunny.chew = .35;
        burst(fr.x, fr.y, 6, null, 160);
        blip(fr.worth > 1 ? 700 : 300 + eaten * 12, .12);
        updateHud();
        if (eaten >= GOAL) { state = 'swell'; swellT = 0; fruits = []; }
        continue;
      }
      if (fr.y > ground() + 10) {
        burst(fr.x, ground(), 3, null, 80);
        fruits.splice(i, 1);
      }
    }

    // inflarse... y BUM
    if (state === 'swell') {
      swellT += dt; shake = Math.min(12, swellT * 6);
      if (Math.random() < .3) blip(200 + swellT * 300, .05, 'triangle', .04);
      if (swellT > 1.8) {
        state = 'boom'; boomT = 0; flash = 1; shake = 40; boomSound();
        const cy = ground() - 120;
        burst(bunny.x, cy, 80, null, 700);
        burst(bunny.x, cy, 40, FRUITS.concat(['⭐','💥','✨']), 600);
        burst(bunny.x, cy, 4, ['🥕'], 500);
      }
    }
    if (state === 'boom') {
      boomT += dt;
      if (boomT > .2) {
        ctx.save(); ctx.globalAlpha = Math.min(1, (boomT - .2) * 3);
        ctx.font = `${Math.min(W * .28, 180)}px ${getComputedStyle(document.body).getPropertyValue('--display') || 'sans-serif'}`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.lineWidth = 10; ctx.strokeStyle = '#24314f'; ctx.fillStyle = '#ff5d8f';
        const sc = 1 + Math.max(0, .5 - boomT) * 1.5;
        ctx.translate(W / 2, H * .38); ctx.scale(sc, sc); ctx.rotate(-.08);
        ctx.strokeText('¡BUM!', 0, 0); ctx.fillText('¡BUM!', 0, 0);
        ctx.restore();
      }
      if (boomT > 2.6 && panel.hidden) {
        ptitle.textContent = '¡Explotó!';
        ptext.textContent = `El conejo se comió ${GOAL} frutas y... ¡BUM! Quedó todo lleno de pelusa y fruta. ¿Otra vez?`;
        playBtn.textContent = 'Otra vez';
        panel.hidden = false; playBtn.focus();
      }
    }

    // partículas
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.vy += 600 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; p.life -= dt;
      if (p.y > ground() && p.vy > 0) { p.y = ground(); p.vy *= -.4; p.vx *= .7; }
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      ctx.globalAlpha = Math.min(1, p.life);
      if (p.e) drawEmoji(p.e, p.x, p.y, p.size, p.rot);
      else { ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * Math.min(1, p.life), 0, 7); ctx.fill(); }
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    if (flash) { ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); }
    requestAnimationFrame(frame);
  }
  reset(); updateHud();
  requestAnimationFrame(frame);
})();
</script>
